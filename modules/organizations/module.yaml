name: organizations
description: Actions and workloads organizations of the instance created in the enterprise, with enterprise-owned Apps installed without repository access.
prerequisites: []
manualSteps:
  - id: delete-instance-organizations
    owner: platform
    description: >-
      Before the organizations module is destroyed, an enterprise owner deletes the actions and workloads
      organizations of the instance in the enterprise settings, only after the destroy of every module that depends on
      organizations succeeded, including enterprise-baseline. A successful destroy need not remove
      the organization Actions restrictions. With promoted live workflows, open a reviewed PR changing
      only .github/workflows/teardown.yml: regenerate it with the installed
      platform/tools/Generate-TeardownWorkflow.ps1 and platform/modules, not the catalog-rewritten template.
      Derive the exact upstream SHA action list from that generated workflow, not a handwritten list.
      In the organization containing the instance repository, use selected actions to permit only these
      external references, without wildcards or broad GitHub or verified-creator allowances.
      Read back the saved policy and compare it with the generated list; stop before deletion if any
      reference is missing, broader access is enabled, or the enterprise policy blocks the change.
      Do not change the enterprise policy or any other organization.
      Only after this PR is merged into main, delete the actions and workloads organizations.
      Then start a new workflow_dispatch of teardown from main; do not use Re-run jobs, which keeps
      the original commit and its catalog action references. Keep emu-identity until the final approvals.
      See the promoted-workflow teardown plan in platform/README.md. GitHub offers no organization deletion with
      the enterprise installation token; the module destroy only verifies that both organizations are gone
      and fails otherwise. Their names stay blocked; a new deployment needs a new bootstrap with a new
      deployment identifier.
    limitations:
      plan: The plan does not show the deletion; it reads only whether each organization exists and which Apps it has.
      drift: Drift detection reports a deleted organization as a failed plan, not as a planned deletion.
      teardown: The first teardown stops at organizations; derive upstream SHA exceptions from the restored template, allow and verify only those in the instance repository organization, then merge the restoration PR before deleting the actions organization and start a new workflow_dispatch from the updated main.
permissions:
  azure: []
  microsoftGraph: []
  githubApp:
    plan:
      permissions:
        enterprise_organization_installations: read
      resources:
        enterprise: true
    # GitHub docs require enterprise_organizations: write for createEnterpriseOrganization; runbook C3 confirms the minimum live.
    apply:
      permissions:
        enterprise_organization_installations: write
        enterprise_organizations: write
      resources:
        enterprise: true
  adminPat: []
            ./instance/platform/tools/Invoke-Module.ps1 -Module 'organization-rulesets' -Action state -InstancePath ./instance/instance.yaml -ModulesPath ./instance/platform/modules -PlatformOrganization $env:GITHUB_REPOSITORY_OWNER -Rulesets

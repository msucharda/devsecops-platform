      - name: Revoke the job installation tokens
        if: ${{ always() && env.PLATFORM_GITHUB_TOKENS != '' }}
        shell: pwsh
        run: ./instance/platform/tools/Remove-PlatformGitHubToken.ps1
  destroy_foundation:
    name: 'foundation (destroy)'
    runs-on: ubuntu-latest
    needs: [select, approve_teardown, enterprise_owner, destroy_application, destroy_service]
    if: ${{ !cancelled() && needs.select.result == 'success' && needs.approve_teardown.result == 'success' && needs.enterprise_owner.result == 'success' && contains(fromJSON(needs.select.outputs.modules), 'foundation') && (needs.destroy_application.result == 'success' || (needs.destroy_application.result == 'skipped' && !contains(fromJSON(needs.select.outputs.modules), 'application'))) && (needs.destroy_service.result == 'success' || (needs.destroy_service.result == 'skipped' && !contains(fromJSON(needs.select.outputs.modules), 'service'))) }}
    environment: ${{ fromJSON(needs.select.outputs.applyEnvironments)['foundation'] }}
    permissions:
      contents: read
      id-token: write
    env:
      TF_IN_AUTOMATION: 'true'
      ARM_USE_OIDC: 'true'
      ARM_USE_AZUREAD: 'true'
      ARM_CLIENT_ID: ${{ vars.AZURE_CLIENT_ID }}
      ARM_TENANT_ID: ${{ vars.AZURE_TENANT_ID }}
      ARM_SUBSCRIPTION_ID: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      PLATFORM_STATE_STORAGE_ACCOUNT: ${{ vars.PLATFORM_STATE_STORAGE_ACCOUNT }}
      PLATFORM_STATE_RESOURCE_GROUP: ${{ vars.PLATFORM_STATE_RESOURCE_GROUP }}
    steps:
      - name: Check out the dispatched main commit
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
        with:
          ref: ${{ github.sha }}
          path: instance
          persist-credentials: false
      - name: Install runtime dependencies
        shell: pwsh
        run: ./instance/platform/tools/Install-ToolDependencies.ps1
      - uses: hashicorp/setup-terraform@b9cd54a3c349d3f38e8881555d616ced269862dd
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Sign in to Azure with the phase managed identity
        uses: Azure/login@7184910d9eb2b1c5e48f7073824a90609bb9b6d6
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Issue an apply-scoped enterprise App installation token
        shell: pwsh
        env:
          PLATFORM_APP_ID: ${{ vars.PLATFORM_APP_ID }}
          PLATFORM_APP_INSTALLATION_ID: ${{ vars.PLATFORM_APP_INSTALLATION_ID }}
          PLATFORM_APP_ENTERPRISE: ${{ vars.PLATFORM_APP_ENTERPRISE }}
          PLATFORM_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
        run: ./instance/platform/tools/New-PlatformGitHubToken.ps1 -Module 'foundation' -Phase apply -InstancePath ./instance/instance.yaml -ModulesPath ./instance/platform/modules
      - name: Require main to still point to the dispatched commit
        shell: pwsh
        env:
          TEARDOWN_MAIN_TOKEN: ${{ github.token }}
        run: ./instance/platform/tools/Assert-TeardownMainCommit.ps1
      - name: Destroy module
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: ./instance/platform/tools/Invoke-Module.ps1 -Module 'foundation' -Action destroy -InstancePath ./instance/instance.yaml -ModulesPath ./instance/platform/modules -PrerequisiteOutputsPath ./artifacts/prerequisites -ArtifactsPath ./artifacts/module-outputs
      - name: Revoke the job installation tokens
        if: ${{ always() && env.PLATFORM_GITHUB_TOKENS != '' }}
        shell: pwsh
        run: ./instance/platform/tools/Remove-PlatformGitHubToken.ps1

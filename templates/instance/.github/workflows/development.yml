name: Develop reference instance
"on":
  workflow_dispatch:
    inputs:
      deployment:
        default: full
        description: Deployment scope
        options:
        - full
        - code-security
        - catalog
        required: true
        type: choice
      operation:
        default: plan
        description: Explicitly approved operation
        options:
        - plan
        - apply
        required: true
        type: choice
      pull-request:
        description: Approved same-repository PR number
        required: true
        type: string
      revision:
        description: Approved full PR head SHA
        required: true
        type: string
permissions:
  contents: read
  pull-requests: read

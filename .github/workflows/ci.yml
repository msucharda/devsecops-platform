name: Source CI

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

# One group per pull request ref, so a new push cancels the older run of that pull request. Every other run
# gets its own group: a shared group would replace a pending main or tag run even without cancel-in-progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event_name == 'pull_request' && github.ref || github.run_id }}
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

permissions:
  contents: read

jobs:
  platform:
    name: Platform tools
    needs: [platform-checks, pester, terraform-roots]
    if: ${{ always() }}
    runs-on: ubuntu-latest
    steps:
      - name: Require all platform checks
        shell: pwsh
        env:
          PLATFORM_RESULT: ${{ needs.platform-checks.result }}
          PESTER_RESULT: ${{ needs.pester.result }}
          ROOTS_RESULT: ${{ needs.terraform-roots.result }}
        run: |
          if ($env:PLATFORM_RESULT -cne 'success' -or $env:PESTER_RESULT -cne 'success' -or $env:ROOTS_RESULT -cne 'success') {
            throw "Platform checks did not pass: static=$env:PLATFORM_RESULT; Pester=$env:PESTER_RESULT; roots=$env:ROOTS_RESULT"
          }

  terraform-roots:
    name: Discover Terraform roots
    runs-on: ubuntu-latest
    outputs:
      roots: ${{ steps.terraform-roots.outputs.roots }}
      has-roots: ${{ steps.terraform-roots.outputs.has-roots }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Discover Terraform roots
        id: terraform-roots
        shell: pwsh
        run: ./tools/Get-TerraformRoots.ps1 -GitHubOutputPath $env:GITHUB_OUTPUT

  platform-checks:
    name: Platform static checks
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tool dependencies
        shell: pwsh
        run: ./tools/Install-ToolDependencies.ps1 -Development
      - name: Check PowerShell
        shell: pwsh
        run: ./tools/Test-PowerShell.ps1
      - name: Validate module manifests
        shell: pwsh
        run: |
          ./tools/Test-ModuleManifests.ps1 -Verbose
          ./tools/Test-ModuleManifests.ps1 -ModulesPath ./tools/tests/fixtures/modules -Verbose
          ./tools/Test-ModuleManifests.ps1 -ModulesPath ./tools/acceptance/github/modules -Verbose
      - name: Validate instance examples
        shell: pwsh
        run: |
          ./tools/Test-InstanceConfiguration.ps1 -InstancePath ./templates/instance/instance.yaml
          ./tools/Test-InstanceConfiguration.ps1 -InstancePath ./tools/tests/fixtures/instance.yaml -ModulesPath ./tools/tests/fixtures/modules
          ./tools/Test-InstanceConfiguration.ps1 -InstancePath ./tools/tests/fixtures/runner-instance.yaml -ModulesPath ./tools/tests/fixtures/runner-modules
          ./tools/Test-ModuleManifests.ps1 -ModulesPath ./tools/tests/fixtures/runner-modules
      - name: Check generated workflows
        shell: pwsh
        run: |
          ./tools/Generate-DeploymentWorkflow.ps1 -Check
          ./tools/Generate-DeploymentWorkflow.ps1 -ModulesPath ./tools/tests/fixtures/modules -OutputPath ./tools/tests/fixtures/deploy.yml -Check
          ./tools/Generate-TeardownWorkflow.ps1 -Check
          ./tools/Generate-TeardownWorkflow.ps1 -ModulesPath ./tools/tests/fixtures/modules -OutputPath ./tools/tests/fixtures/teardown.yml -Check
      - name: Validate deployment workflow syntax
        run: go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/ci.yml .github/workflows/release.yml templates/instance/.github/workflows/deploy.yml templates/instance/.github/workflows/drift.yml templates/instance/.github/workflows/teardown.yml templates/instance/.github/workflows/vendor.yml tools/tests/fixtures/deploy.yml tools/tests/fixtures/drift.yml tools/tests/fixtures/teardown.yml tools/acceptance/github/bootstrap-acceptance.yml
      - name: Validate instance workflows that call local reusable workflows
        # actionlint resolves ./.github/workflows/<file> from the project root, so the instance caller is checked
        # in a separate project that has the layout of an instance repository.
        run: |
          project="$(mktemp -d)"
          mkdir -p "$project/.github/workflows"
          cp templates/instance/.github/workflows/import-release.yml templates/instance/.github/workflows/import-action.yml templates/instance/.github/workflows/vendor.yml "$project/.github/workflows/"
          git init -q "$project"
          cd "$project"
          go run github.com/rhysd/actionlint/cmd/actionlint@v1.7.7 -shellcheck= -pyflakes= .github/workflows/import-release.yml .github/workflows/import-action.yml

  pester:
    name: Pester (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      PESTER_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tool dependencies
        shell: pwsh
        run: ./tools/Install-ToolDependencies.ps1 -Development
      - name: Install Terraform for offline runner tests
        uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Run Pester
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -CI -Shard $env:PESTER_SHARD
      - name: Upload test results
        if: ${{ !cancelled() }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pester-results-${{ matrix.shard }}
          path: artifacts/pester-${{ matrix.shard }}-of-4.xml
          if-no-files-found: error

  interruption:
    name: Interruption harness (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      INTERRUPTION_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tool dependencies
        shell: pwsh
        run: ./tools/Install-ToolDependencies.ps1 -Development
      - name: Interrupt every state-changing step
        shell: pwsh
        run: ./tools/Invoke-Tests.ps1 -Tag Interruption

  mutation-shards:
    name: Security check mutations (${{ matrix.shard }}/4)
    runs-on: ubuntu-latest
    timeout-minutes: 10
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    env:
      MUTATION_SHARD: ${{ matrix.shard }}/4
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install tool dependencies
        shell: pwsh
        run: ./tools/Install-ToolDependencies.ps1 -Development
      - name: Weaken every marked security check
        shell: pwsh
        run: ./tools/Invoke-MutationTests.ps1 -Shard $env:MUTATION_SHARD -ReportPath ./artifacts/mutation-report.json
      - name: Upload mutation report
        if: ${{ !cancelled() && hashFiles('artifacts/mutation-report.json') != '' }}
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: mutation-report-${{ matrix.shard }}
          path: artifacts/mutation-report.json
          if-no-files-found: error

  mutation:
    name: Security check mutation tests
    needs: mutation-shards
    if: ${{ always() }}
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - name: Require every mutation shard
        shell: pwsh
        env:
          MUTATION_RESULT: ${{ needs.mutation-shards.result }}
        run: |
          if ($env:MUTATION_RESULT -cne 'success') {
            throw "Mutation shards did not pass: '$env:MUTATION_RESULT'."
          }
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262
      - name: Download mutation shards
        uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          pattern: mutation-report-*
          path: artifacts/mutation-shards
      - name: Verify the full mutation inventory
        shell: pwsh
        run: ./tools/Invoke-MutationTests.ps1 -MergeReport @(Get-ChildItem ./artifacts/mutation-shards -Recurse -Filter mutation-report.json | Select-Object -ExpandProperty FullName) -ShardCount 4 -ReportPath ./artifacts/mutation-report.json
      - name: Upload mutation report
        if: ${{ !cancelled() && hashFiles('artifacts/mutation-report.json') != '' }}
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: mutation-report
          path: artifacts/mutation-report.json
          if-no-files-found: error

  terraform:
    name: Terraform (${{ matrix.root }})
    needs: terraform-roots
    if: ${{ needs.terraform-roots.outputs.has-roots == 'true' }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        root: ${{ fromJSON(needs.terraform-roots.outputs.roots) }}
    env:
      TF_ROOT: ${{ matrix.root }}
      TF_IN_AUTOMATION: 'true'
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - uses: terraform-linters/setup-tflint@6ffdbaa3be476b3431f7275c26966ef32ff60337 # v6.3.2
        with:
          tflint_version: v0.60.0
      - uses: aquasecurity/setup-trivy@81e514348e19b6112ce2a7e3ecbafe19c1e1f567 # v0.3.1
        with:
          version: v0.72.0
          cache: false
      - name: Terraform format
        run: terraform -chdir="$TF_ROOT" fmt -check -diff
      - name: Terraform validate
        run: |
          terraform -chdir="$TF_ROOT" init -backend=false -input=false
          terraform -chdir="$TF_ROOT" validate
      - name: Terraform test
        run: |
          if [ -d "$TF_ROOT/tests" ]; then
            terraform -chdir="$TF_ROOT" test
          fi
      - name: TFLint
        run: |
          tflint --chdir="$TF_ROOT" --init
          tflint --chdir="$TF_ROOT"
      - name: Trivy
        run: trivy config --exit-code 1 --severity HIGH,CRITICAL "$TF_ROOT"

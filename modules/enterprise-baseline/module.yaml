name: enterprise-baseline
description: Organization controls of the instance organizations; enterprise controls outside App-only automation are manual prerequisites.
prerequisites:
  - organizations
  - actions-catalog
manualPrerequisites:
  - privateInternalForksDisabled
  - repositoryManagementPoliciesEnforced
  - emuUserNamespacesRestricted
  - fineGrainedPatApprovalRequired
  - patMaxLifetime90Days
manualSteps: []
permissions:
  azure: []
  microsoftGraph: []
  githubApp:
    plan:
      permissions:
        organization_administration: read
      resources:
        organizations: target_organizations
    apply:
      permissions:
        organization_administration: write
      resources:
        organizations: target_organizations
    rulesetPlan:
      permissions:
        organization_administration: write
      resources:
        organizations: target_organizations
      purpose: organization-rulesets-full-read
  adminPat: []

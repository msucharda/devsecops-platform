      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: 1.16.5
          terraform_wrapper: false
      - name: Verify Terraform checksum
        shell: pwsh
        run: ./trusted/platform/tools/Test-ToolBinary.ps1 -Name Terraform
      - name: Sign in to Azure with the phase managed identity
        uses: Azure/login@a641126d1b8aa4d1fa005f4f92df94a3a4c4c906 # v3.1.0
        with:
          client-id: ${{ vars.AZURE_CLIENT_ID }}
          tenant-id: ${{ vars.AZURE_TENANT_ID }}
          subscription-id: ${{ vars.AZURE_SUBSCRIPTION_ID }}
      - name: Issue a phase-scoped enterprise App installation token
        shell: pwsh
        env:
          PLATFORM_APP_ID: ${{ vars.PLATFORM_APP_ID }}
          PLATFORM_APP_INSTALLATION_ID: ${{ vars.PLATFORM_APP_INSTALLATION_ID }}
          PLATFORM_APP_ENTERPRISE: ${{ vars.PLATFORM_APP_ENTERPRISE }}
          PLATFORM_APP_PRIVATE_KEY: ${{ secrets.PLATFORM_APP_PRIVATE_KEY }}
        run: ./trusted/platform/tools/New-PlatformGitHubToken.ps1 -Module 'service' -Phase apply -InstancePath ./candidate/instance.yaml -ModulesPath ./candidate/platform/modules
      - name: Download outputs of application
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apply-outputs-application
          path: ./artifacts/prerequisites
      - name: Download outputs of foundation
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: apply-outputs-foundation
          path: ./artifacts/prerequisites
      - name: Run module
        shell: pwsh
        env:
          GITHUB_TOKEN: ${{ env.GH_TOKEN }}
        run: ./candidate/platform/tools/Invoke-Module.ps1 -Module 'service' -Action apply -InstancePath ./candidate/instance.yaml -ModulesPath ./candidate/platform/modules -PrerequisiteOutputsPath ./artifacts/prerequisites -ArtifactsPath ./artifacts/module-outputs -PlatformOrganization $env:GITHUB_REPOSITORY_OWNER
      - name: Upload public module outputs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: apply-outputs-service
          path: ./artifacts/module-outputs/service.json
          if-no-files-found: error
          retention-days: 1
      - name: Revoke the job installation tokens
        if: ${{ always() && env.PLATFORM_GITHUB_TOKENS != '' }}
        shell: pwsh
        run: ./trusted/platform/tools/Remove-PlatformGitHubToken.ps1
